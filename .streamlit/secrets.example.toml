# Copia estas secciones a .streamlit/secrets.toml (no subas claves reales a git)
# En Streamlit Cloud: Settings → Secrets (misma estructura)

[supabase]
url = "https://TU_PROYECTO.supabase.co"
key = "TU_SUPABASE_ANON_KEY"

# Opcional: credenciales Google en secrets (Supabase OAuth usa las del panel Supabase)
[google_oauth]
client_id = "TU_CLIENT_ID.apps.googleusercontent.com"
client_secret = "TU_CLIENT_SECRET"

[app]
# URL pública de la app — única fuente de verdad para OAuth redirect_to
# Debe coincidir con Supabase → Authentication → Site URL y Redirect URLs
base_url = "https://veloxperu.streamlit.app"
# Legacy (se usa solo si base_url no está definida)
redirect_url = "https://veloxperu.streamlit.app"
# Alternativa en despliegue: variable de entorno VELOX_BASE_URL
# En local sin base_url: http://localhost:8501 (automático)

whatsapp_admin_url = "https://w.app/s58dpa"
# whatsapp_admin = "51987654321"

[culqi]
public_key = "pk_test_XXXXXXXXXXXXXXXX"
secret_key = "sk_test_XXXXXXXXXXXXXXXX"

[payments]
yape_qr_path = "assets/qr_pago.png"
