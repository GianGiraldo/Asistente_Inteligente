<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="refresh" content="3"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>veloX — Iniciando</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #0b1220; color: #e5e7eb;
    }
    .box { text-align: center; padding: 2rem; max-width: 28rem; }
    .spinner {
      width: 52px; height: 52px; border: 4px solid rgba(74, 111, 165, 0.25);
      border-top-color: #4a6fa5; border-right-color: #00E5FF; border-radius: 50%;
      animation: spin 0.85s linear infinite; margin: 0 auto 1rem;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.22);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>veloX</h1>
    <p>Iniciando plataforma…</p>
    <p><small>Espere unos minutos. La página se actualizará automáticamente.</small></p>
  </div>
</body>
</html>
